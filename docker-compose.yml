services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: trustdraft
      POSTGRES_USER: trustdraft
      POSTGRES_PASSWORD: trustdraft
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustdraft -d trustdraft"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
